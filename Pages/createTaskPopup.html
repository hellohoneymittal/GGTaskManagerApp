<!doctype html>
<div class="popup" id="createTaskPopup">
  <div class="popup-content scrollable-content">
    <div class="user-info-block"></div>
    <div class="refresh-button-container">
      <div class="popup-title-box"></div>
      <div class="refresh-button-div">
        <button class="refresh-btn-new" onclick="callCreateBtnAPI()">
          <span class="refresh-text">Refresh</span>
          <span class="refresh-icon">⟳</span>
        </button>
      </div>
    </div>

    <div>
      <label>Select Department</label>

      <select id="departmentSelect"></select>
    </div>
    <div>
      <label>Select Category</label>

      <select id="categorySelect"></select>
    </div>
    <div class="task-buttons">
      <label style="font-weight: bold"> Sub Category </label>

      <div id="taskButtonsContainer"></div>
    </div>
    <div id="taskOwnerReviewerDiv">
      <div>
        <label>Task Owner</label>
        <input
          type="text"
          id="taskOwner"
          class="grayOut"
          readonly
          placeholder="Owner auto selected"
        />
      </div>

      <div>
        <label>Task Reviewer</label>
        <input
          type="text"
          id="taskReviewer"
          class="grayOut"
          readonly
          placeholder="Reviewer auto selected"
        />
      </div>
    </div>

    <div id="behaviouralTaskDiv">
      <div>
        <label>Select Student</label>

        <div class="liveSearchContainer">
          <input
            type="text"
            id="stdBehavInput"
            class="liveSearch"
            placeholder="Select Student..."
          />
          <button class="liveSearchClearBtn" id="stdBehavInputClrBtn">
            &times;
          </button>
          <ul id="stdBehavInputULList" class="liveSearchUL"></ul>
        </div>
      </div>

      <div id="behaviouralTaskDivReviewer">
        <label>Task Owner</label>
        <input
          type="text"
          id="behaviouralTaskOwner"
          class="grayOut"
          readonly
          placeholder="Task owner auto selected"
        />
      </div>
    </div>

    <div id="stdCareTaskDiv">
      <div>
        <label>Select Student</label>

        <div class="liveSearchContainer">
          <input
            type="text"
            id="stdCareInput"
            class="liveSearch"
            placeholder="Select Student..."
          />
          <button class="liveSearchClearBtn" id="stdCareInputClrBtn">
            &times;
          </button>
          <ul id="stdCareInputULList" class="liveSearchUL"></ul>
        </div>
      </div>

      <div id="stdCareTaskDivReviewer">
        <label>Task Owner</label>
        <input
          type="text"
          id="stdCareTaskOwner"
          class="grayOut"
          readonly
          placeholder="Task owner auto selected"
        />
      </div>
    </div>

    <div style="margin-top: 25px">
      <label>Task Description</label>

      <textarea
        id="taskDescription"
        placeholder="Please add task details in at least 5 words."
      ></textarea>
    </div>

    <div>
      <label for="ctUploadControl" style="margin-bottom: 10px"
        >Upload File</label
      >
      <input
        style="width: 96% !important"
        type="file"
        accept="image/*"
        id="ctUploadControl"
        onchange="ctFetchFile()"
      />
    </div>

    <div id="imagePreviewContainer" style="margin-top: 15px; display: none">
      <label>Preview</label>

      <img
        id="imagePreview"
        alt="Preview"
        style="
          width: 100%;
          max-height: 250px;
          object-fit: contain;
          border-radius: 8px;
          border: 1px solid #ccc;
          margin-top: 10px;
        "
      />
    </div>

    <div class="button-row">
      <button class="red" onclick="backToMainScreenFromCreateTask()">
        Back
      </button>
      <button class="green" onclick="createNewTaskBtnClick()">Proceed</button>
    </div>
  </div>
</div>
